<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0f">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Гайд по еженедельному событию VS (Состязание альянсов) в Z Route: Redemption — RU/EN, офлайн">
<title>VS-гид · Z Route: Redemption</title>
<style>
/* Тёмная «рейдовая» тема + светлая альтернатива. Без внешних шрифтов и CDN. */
:root {
  --bg: #0e1113;
  --bg-grad: radial-gradient(1200px 600px at 50% -10%, #1d2622 0%, #0e1113 60%);
  --card: #161c1f;
  --card-2: #1b2327;
  --line: #253036;
  --line-soft: #1e272c;
  --text: #e9eff2;
  --muted: #94a3aa;
  --dim: #6f7f86;
  --accent: #ff7a1a;
  --accent-2: #ffb457;
  --accent-soft: rgba(255, 122, 26, 0.12);
  --ok: #46c98a;
  --ok-soft: rgba(70, 201, 138, 0.14);
  --warn: #ffcc66;
  --danger: #ff6f6f;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 62px;
}

html[data-theme="light"] {
  --bg: #f6f3ed;
  --bg-grad: radial-gradient(1200px 600px at 50% -10%, #ffe9d2 0%, #f6f3ed 55%);
  --card: #ffffff;
  --card-2: #fbf7f1;
  --line: #e6ded2;
  --line-soft: #efe8dd;
  --text: #1b2225;
  --muted: #5c6a70;
  --dim: #7d8a8f;
  --accent: #d9620d;
  --accent-2: #b8480a;
  --accent-soft: rgba(217, 98, 13, 0.1);
  --ok: #1f8f5f;
  --ok-soft: rgba(31, 143, 95, 0.12);
  --warn: #a06a00;
  --danger: #b23c3c;
  --shadow: 0 10px 24px rgba(60, 40, 20, 0.08);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
}

body { background-image: var(--bg-grad); background-repeat: no-repeat; background-attachment: fixed; }

a { color: var(--accent-2); text-decoration: none; }
strong, b { color: var(--text); font-weight: 650; }
small { font-size: 12px; }

/* ---------- каркас ---------- */
.app { min-height: 100vh; padding-bottom: calc(var(--nav-h) + 26px); }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px 10px;
  background: rgba(14, 17, 19, 0.9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
html[data-theme="light"] .topbar { background: rgba(246, 243, 237, 0.9); }

.topbar .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.topbar .brand b { font-size: 15px; letter-spacing: 0.2px; }
.topbar .brand span { font-size: 11.5px; color: var(--dim); letter-spacing: 0.3px; text-transform: uppercase; }
.topbar .spacer { flex: 1; }

.lang-btn {
  height: 38px; min-width: 44px; padding: 0 10px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--accent-2);
  font: inherit; font-size: 12.5px; font-weight: 700; letter-spacing: 0.6px; cursor: pointer;
}
.lang-btn:active { transform: scale(0.96); }

.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); cursor: pointer;
  font-size: 16px; line-height: 1;
}
.icon-btn:active { transform: scale(0.96); }
.exit-btn { color: var(--muted); }
.exit-btn:active { color: var(--danger); }

.topbar .brand { overflow: hidden; }
.topbar .brand b, .topbar .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main { padding: 14px 16px 8px; max-width: 720px; margin: 0 auto; }

/* ---------- типографика ---------- */
h1 { font-size: 26px; line-height: 1.18; margin: 4px 0 8px; letter-spacing: -0.4px; }
h2 { font-size: 18px; margin: 22px 0 10px; letter-spacing: -0.2px; }
h3 { font-size: 15px; margin: 18px 0 8px; color: var(--text); }
p { margin: 8px 0; color: var(--text); }
.lead { color: var(--muted); font-size: 14.5px; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }

.eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.9px;
  color: var(--accent-2); font-weight: 700;
}

/* ---------- шапка-герой ---------- */
.hero {
  position: relative; overflow: hidden;
  border-radius: 20px; padding: 18px 16px 16px;
  background: linear-gradient(160deg, #26201a 0%, #171d1f 55%, #141a1c 100%);
  border: 1px solid #33291f;
  box-shadow: var(--shadow);
}
html[data-theme="light"] .hero {
  background: linear-gradient(160deg, #fff2e2 0%, #fdf9f3 60%, #f7f2e9 100%);
  border-color: #f0dcc4;
}
.hero::after {
  content: ""; position: absolute; inset: -40% -10% auto auto; width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(255, 122, 26, 0.35), transparent 65%);
  pointer-events: none;
}
.hero h1 { margin: 6px 0 6px; font-size: 27px; }
.hero p { margin: 0; color: var(--muted); font-size: 14px; }
.hero .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 999px;
  background: var(--card-2); border: 1px solid var(--line);
  font-size: 12px; color: var(--muted); white-space: nowrap;
}
.chip b { color: var(--text); }
.chip.accent { background: var(--accent-soft); border-color: rgba(255, 122, 26, 0.35); color: var(--accent-2); }

/* ---------- сетка фактов ---------- */
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.fact {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 12px;
}
.fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); }
.fact .v { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; margin-top: 2px; }
.fact .s { font-size: 11.5px; color: var(--muted); }

/* ---------- карточки ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px; margin-top: 12px;
}
.card.tight { padding: 12px; }
.card.accent-border { border-color: rgba(255, 122, 26, 0.3); }

.section-head { display: flex; align-items: baseline; gap: 8px; margin: 24px 0 6px; }
.section-head h2 { margin: 0; }
.section-head .count { font-size: 12px; color: var(--dim); }

/* ---------- список фаз ---------- */
.phase-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px; margin-top: 8px; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  color: var(--text); cursor: pointer; font: inherit;
}
.phase-item:active { background: var(--card-2); }
.phase-item .num {
  width: 38px; height: 38px; flex: 0 0 38px; border-radius: 11px;
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
  background: var(--accent-soft); color: var(--accent-2); border: 1px solid rgba(255,122,26,0.25);
}
.phase-item .txt { flex: 1; min-width: 0; }
.phase-item .txt b { display: block; font-size: 15px; }
.phase-item .txt span { font-size: 12.5px; color: var(--muted); }
.phase-item .dp { font-size: 11px; color: var(--dim); text-align: right; }
.phase-item .chev { color: var(--dim); font-size: 18px; }

/* ---------- таблицы ---------- */
.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { background: var(--card-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); font-weight: 600; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent-2); font-weight: 600; }
td .unit { color: var(--dim); font-weight: 400; font-size: 11px; }

/* ---------- списки ---------- */
ul.clean, ol.steps { margin: 8px 0; padding: 0; list-style: none; }
ul.clean li { position: relative; padding-left: 18px; margin: 7px 0; color: var(--text); font-size: 14px; }
ul.clean li::before {
  content: ""; position: absolute; left: 4px; top: 9px; width: 5px; height: 5px;
  border-radius: 50%; background: var(--accent);
}
ol.steps { counter-reset: s; }
ol.steps li {
  counter-increment: s; position: relative; padding-left: 32px; margin: 9px 0; font-size: 14px;
}
ol.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 1px;
  width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
  background: var(--card-2); border: 1px solid var(--line);
  font-size: 11.5px; font-weight: 700; color: var(--accent-2);
}

ul.bad li::before { content: "✕"; color: var(--danger); background: none; width: auto; height: auto; top: 0; left: 0; font-size: 12px; }
ul.bad li { padding-left: 20px; }
ul.good li::before { content: "✓"; color: var(--ok); background: none; width: auto; height: auto; top: 0; left: 0; font-size: 12px; }
ul.good li { padding-left: 20px; }

.note {
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 10px 10px 0;
  padding: 10px 12px; margin: 12px 0; font-size: 13.5px; color: var(--text);
}
.note.warn { border-color: var(--warn); background: rgba(255, 204, 102, 0.1); }
.note.ok { border-color: var(--ok); background: var(--ok-soft); }

/* ---------- навигация между фазами ---------- */
.pager { display: flex; gap: 8px; margin-top: 18px; }
.pager button {
  flex: 1; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
}
.pager button span { color: var(--dim); font-size: 11px; }
.pager button:disabled { opacity: 0.35; }

/* ---------- чек-листы ---------- */
.check {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 2px; border-bottom: 1px solid var(--line-soft);
  cursor: pointer; font-size: 14px;
}
.check:last-child { border-bottom: none; }
.check input { position: absolute; opacity: 0; width: 0; height: 0; }
.check .box {
  width: 20px; height: 20px; flex: 0 0 20px; margin-top: 1px;
  border-radius: 6px; border: 1.5px solid var(--line);
  background: var(--card-2); display: grid; place-items: center;
  transition: background 0.15s, border-color 0.15s;
}
.check .box::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #111; border-bottom: 2px solid #111; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.check input:checked + .box { background: var(--ok); border-color: var(--ok); }
.check input:checked + .box::after { opacity: 1; }
.check input:checked ~ .txt { color: var(--dim); text-decoration: line-through; }
.check .txt { flex: 1; }

.progress { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; }
.progress .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.25s; }
.progress .val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- дни ---------- */
.days { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; margin: 6px -16px 0; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day-chip {
  flex: 0 0 auto; padding: 8px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card);
  color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.day-chip b { display: block; font-size: 13px; color: var(--text); }
.day-chip small { font-size: 10.5px; color: var(--dim); }
.day-chip.active { border-color: rgba(255, 122, 26, 0.55); background: var(--accent-soft); }
.day-chip.active b { color: var(--accent-2); }

/* ---------- калькулятор ---------- */
.seg { display: flex; gap: 6px; overflow-x: auto; margin: 8px -16px 0; padding: 2px 16px 8px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 0 0 auto; padding: 8px 12px; border-radius: 10px; font: inherit; font-size: 12.5px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer;
}
.seg button.active { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 700; }

.calc-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.calc-row:last-of-type { border-bottom: none; }
.calc-row .lbl { flex: 1; font-size: 13.5px; }
.calc-row .lbl small { display: block; color: var(--dim); font-size: 11.5px; }
.calc-row input[type="number"] {
  width: 88px; padding: 8px 9px; border-radius: 9px; text-align: right;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text);
  font: inherit; font-variant-numeric: tabular-nums;
}
.calc-row input:focus { outline: 2px solid rgba(255,122,26,0.4); outline-offset: 0; }
.calc-row .per { width: 74px; text-align: right; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

.total-card {
  position: sticky; bottom: var(--nav-h); z-index: 20;
  margin: 14px -16px 0; padding: 12px 16px 14px; border-radius: 16px 16px 0 0;
  background: linear-gradient(180deg, #241c14, #1a2124 60%);
  border: 1px solid rgba(255, 122, 26, 0.3); border-bottom: 0;
  box-shadow: 0 -12px 26px rgba(0, 0, 0, 0.45);
}
html[data-theme="light"] .total-card { background: linear-gradient(180deg, #fff7ec, #fdfaf4 60%); border-color: #f2d3ac; box-shadow: 0 -10px 22px rgba(90, 60, 20, 0.12); }
.total-card .head { display: flex; align-items: baseline; gap: 10px; }
.total-card .sum { font-size: 26px; font-weight: 750; letter-spacing: -0.6px; color: var(--accent-2); font-variant-numeric: tabular-nums; }
.total-card .sub { font-size: 11.5px; color: var(--muted); }
.total-card .next { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.total-card .bar { height: 5px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 7px; }
.total-card .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
.calc-spacer { height: 96px; }
.today-card { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 14px;
  background: var(--accent-soft); border: 1px solid rgba(255,122,26,0.3);
  font: inherit; color: var(--text); text-align: left; cursor: pointer; width: 100%; }
.today-card:active { transform: translateY(1px); }
.today-card .chev { color: var(--accent-2); font-size: 18px; }
.today-card .t { flex: 1; min-width: 0; }
.today-card .t b { display: block; font-size: 14px; }
.today-card .t span { font-size: 12px; color: var(--muted); }

.bonus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.bonus-grid label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
.bonus-grid input { padding: 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--card-2); color: var(--text); font: inherit; text-align: right; }

/* ---------- награды ---------- */
.reward {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 0; border-bottom: 1px solid var(--line-soft);
}
.reward:last-child { border-bottom: none; }
.reward .at {
  flex: 0 0 78px; font-size: 12.5px; font-weight: 700; color: var(--accent-2);
  font-variant-numeric: tabular-nums;
}
.reward .at small { display: block; color: var(--dim); font-weight: 400; font-size: 10.5px; }
.reward .txt { font-size: 13px; color: var(--text); }

.tier-title { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 2px; flex-wrap: wrap; }
.tier-title b { font-size: 14px; white-space: nowrap; }
.tier-title span { font-size: 12px; color: var(--dim); }

/* ---------- аккордеон ---------- */
details.acc {
  border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  margin-top: 8px; overflow: hidden;
}
details.acc summary {
  padding: 12px 14px; cursor: pointer; font-size: 14px; font-weight: 600;
  list-style: none; display: flex; gap: 8px; align-items: center;
}
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; margin-left: auto; color: var(--dim); font-size: 16px; }
details.acc[open] summary::after { content: "–"; }
details.acc .body { padding: 0 14px 13px; font-size: 13.5px; color: var(--muted); }

/* ---------- нижняя навигация ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: rgba(16, 21, 23, 0.94);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(16px);
}
html[data-theme="light"] .nav { background: rgba(252, 249, 243, 0.96); }
.nav button {
  border: 0; background: none; padding: 6px 2px; font: inherit; cursor: pointer;
  color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10.5px; letter-spacing: 0.2px; border-radius: 10px;
}
.nav button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.nav button.active { color: var(--accent-2); }
.nav button:active { background: var(--card); }

/* ---------- время: сервер / местное ---------- */
.tz-card { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.tz-clock { flex: 1; min-width: 190px; font-size: 12.5px; color: var(--muted); }
.tz-clock b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700; }
.tz-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tz-seg button { border: 0; background: var(--card-2); color: var(--muted); font: inherit; font-size: 12px; padding: 7px 11px; cursor: pointer; }
.tz-seg button.active { background: var(--accent); color: #1a1206; font-weight: 700; }

.slot-row { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.slot-row:last-child { border-bottom: none; }
.slot-row .time { flex: 0 0 52px; color: var(--accent-2); font-weight: 650; font-variant-numeric: tabular-nums; }
.slot-row .name { color: var(--text); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card-2); color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 700; }
.btn.block { width: 100%; }
.btn:active { transform: translateY(1px); }

.row { display: flex; gap: 8px; align-items: center; }
.gap { height: 8px; }
.footer-note { margin: 22px 0 10px; font-size: 11.5px; color: var(--dim); text-align: center; line-height: 1.6; }

@media (min-width: 560px) {
  .facts { grid-template-columns: repeat(4, 1fr); }
  h1 { font-size: 30px; }
}

/* ---------- полоса времени (глобальная) ---------- */
.tzbar { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line-soft); }
.tz-chip {
  flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 5px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--muted); font: inherit; cursor: pointer;
  font-size: 10.5px; letter-spacing: 0.4px; text-transform: uppercase;
}
.tz-chip b { font-size: 13px; color: var(--text); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.tz-chip.active { border-color: rgba(255, 122, 26, 0.5); background: var(--accent-soft); }
.tz-chip.active b { color: var(--accent-2); }

/* ---------- метка окна у задания ---------- */
.task-when {
  display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid rgba(255, 122, 26, 0.35); background: var(--accent-soft);
  color: var(--accent-2); font-size: 10.5px; font-weight: 600; white-space: nowrap; vertical-align: 1px;
}

.rem-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }

.rem-txt { flex: 1; min-width: 0; }
.rem-txt b { font-size: 14px; }
.rem-txt .muted { font-size: 11.5px; margin-top: 2px; }
.switch { flex: 0 0 46px; width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); position: relative; cursor: pointer; padding: 0; }
.switch i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: transform .15s, background .15s; }
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch.on i { transform: translateX(20px); background: #1a1206; }


/* ---------- шторка подтверждения ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.sheet[hidden] { display: none; }
.sheet-box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.sheet-box b { font-size: 16px; line-height: 1.35; }
.sheet-actions { display: flex; gap: 8px; margin-top: 14px; }
.sheet-actions .btn { flex: 1; }


/* ---------- состояние напоминаний ---------- */
.rem-status { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.rem-line { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); padding: 3px 0; }
.rem-line b { color: var(--text); font-variant-numeric: tabular-nums; }
.rem-line b.ok { color: var(--ok); }
.rem-line b.bad { color: var(--danger); }

.nav button { position: relative; }

.upd-card { border-color: rgba(255, 122, 26, 0.22); }

.upd-line b { font-variant-numeric: tabular-nums; }
.upd-line b.ok { color: var(--ok); }
.upd-line b.bad { color: var(--danger); }
.upd-line b.new { color: var(--accent-2); font-size: 15px; }

.upd-sub { font-size: 11.5px; color: var(--dim); }

.upd-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.upd-actions .btn { width: 100%; }
.upd-checked { margin-top: 9px; font-size: 11px; color: var(--dim); }
.upd-auto { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--line-soft); }
.upd-auto > span { flex: 1; font-size: 12.5px; color: var(--muted); }
.upd-auto i { display: block; font-style: normal; font-size: 11px; }
.upd-bar { height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; margin-top: 10px; }
.upd-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.2s; }
.upd-pct { margin-top: 5px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.upd-notes summary::-webkit-details-marker { display: none; }
.upd-notes summary::after { content: "+"; float: right; color: var(--dim); }
.upd-notes[open] summary::after { content: "-"; }
.upd-notes-body { padding: 0 12px 11px; font-size: 12.5px; color: var(--muted); max-height: 220px; overflow: auto; line-height: 1.55; }

.upd-dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-2); animation: updpulse 1s infinite; }
.upd-dots i:nth-child(2) { animation-delay: 0.15s; }

/* Проверка обновлений и установка APK из GitHub Releases (0.2.9+).
   Работает в двух режимах:
     • APK — через мост VSNative (запрос к api.github.com, скачивание, установщик);
     • HTML — прямым fetch к api.github.com и ссылкой на скачивание.
   Гайд при этом остаётся офлайн: сеть нужна только для обновления. */
(function () {
  "use strict";

  var REPO = "Suslyandia/ZRouteVSguide";
  var API = "https://api.github.com/repos/" + REPO + "/releases/latest";
  var MANIFEST = "version.json";            // лежит рядом с сайтом: без CORS и без лимитов
  var PAGE = "https://github.com/" + REPO + "/releases";

  var K_LAST = "vs.upd.last";
  var K_AUTO = "vs.upd.auto";
  var K_HIDE = "vs.upd.hide";
  var K_NOAUTO = "vs.upd.noauto";
  var DAY_MS = 24 * 3600 * 1000;

  var S = {
    state: "idle",     // idle | checking | latest | available | downloading | downloaded | needperm | installing | error
    err: "",
    rel: null,
    at: 0,
    pct: 0,
    got: 0,
    total: 0,
    file: false,
    silentErr: ""
  };

  /* ---------- окружение ---------- */

  function native() {
    return !!(window.VSNative && window.VSNative.isNative && window.VSNative.isNative());
  }

  function read(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }

  function write(k, v) {
    try { localStorage.setItem(k, v); } catch (e) {}
  }

  function lang() {
    return (window.VSUI && window.VSUI.lang) ||
      (document.documentElement.getAttribute("lang") === "en" ? "en" : "ru");
  }

  function T(key, vars) {
    var dict = window.STR ? (window.STR[lang()] || window.STR.ru) : {};
    var s = dict[key] != null ? dict[key] : (window.STR && window.STR.ru[key] != null ? window.STR.ru[key] : key);
    if (vars) {
      for (var k in vars) {
        if (Object.prototype.hasOwnProperty.call(vars, k)) {
          s = s.split("{" + k + "}").join(vars[k]);
        }
      }
    }
    return s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function curVersion() {
    if (native()) {
      try {
        var v = window.VSNative.appVersion();
        if (v) return v;
      } catch (e) {}
    }
    return (window.DATA_RU && window.DATA_RU.version) || "";
  }

  function canInstall() {
    if (!native()) return false;
    try { return !!window.VSNative.canInstallPackages(); } catch (e) { return true; }
  }

  function fileReady() {
    if (!native()) return false;
    try { return !!window.VSNative.updateFileReady(); } catch (e) { return false; }
  }

  /* ---------- версии ---------- */

  function verOf(s) {
    var m = String(s == null ? "" : s).match(/\d+(?:\.\d+)*/);
    return m ? m[0] : "";
  }

  function cmpVer(a, b) {
    var x = String(a || "0").split(".");
    var y = String(b || "0").split(".");
    var n = Math.max(x.length, y.length);
    for (var i = 0; i < n; i++) {
      var p = parseInt(x[i] || "0", 10) || 0;
      var q = parseInt(y[i] || "0", 10) || 0;
      if (p > q) return 1;
      if (p < q) return -1;
    }
    return 0;
  }

  function newer() {
    return !!(S.rel && cmpVer(S.rel.version, verOf(curVersion())) > 0);
  }

  function hidden() {
    return !!(S.rel && read(K_HIDE) === S.rel.tag);
  }

  /* ---------- время «проверено … назад» ---------- */

  function whenText(at) {
    if (!at) return T("upd.never");
    var d = Date.now() - at;
    if (d < 0) d = 0;
    var min = Math.floor(d / 60000);
    if (min < 1) return T("upd.when.now");
    if (min < 60) return T("upd.when.min", { n: min });
    var h = Math.floor(min / 60);
    if (h < 24) return T("upd.when.hour", { n: h });
    return T("upd.when.day", { n: Math.floor(h / 24) });
  }

  function dateText(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(lang() === "en" ? "en-GB" : "ru-RU",
      { day: "2-digit", month: "short", year: "numeric" });
  }

  /* ---------- состояние ---------- */

  function saveRel() {
    if (!S.rel) return;
    write(K_LAST, JSON.stringify({
      at: S.at, tag: S.rel.tag, version: S.rel.version, name: S.rel.name,
      notes: S.rel.notes, published: S.rel.published, page: S.rel.page,
      apk: S.rel.apk, html: S.rel.html
    }));
  }

  function loadRel() {
    var raw = read(K_LAST);
    if (!raw) return;
    try {
      var o = JSON.parse(raw);
      S.rel = {
        tag: String(o.tag || ""), version: String(o.version || verOf(o.tag)),
        name: String(o.name || o.tag || ""), notes: String(o.notes || ""),
        published: String(o.published || ""), page: String(o.page || PAGE),
        apk: o.apk || null, html: o.html || null
      };
      S.at = o.at || 0;
      if (newer()) S.state = "available";
      else S.state = "latest";
    } catch (e) {}
  }

  function autoOn() {
    return read(K_AUTO) !== "0";
  }

  function noAuto() {
    try { if (sessionStorage.getItem(K_NOAUTO) === "1") return true; } catch (e) {}
    return read(K_NOAUTO) === "1";
  }

  /** Текст ошибки по её коду: неизвестный код не должен показывать пустоту. */
  function errText(code) {
    var key = "upd.err." + code;
    var dict = window.STR ? (window.STR[lang()] || {}) : {};
    var ru = window.STR ? (window.STR.ru || {}) : {};
    if (dict[key]) return dict[key];
    if (ru[key]) return ru[key];
    return T("upd.err.other");
  }

  function renderNow() {
    var y = window.pageYOffset || 0;
    if (window.__vsRender) {
      window.__vsRender();
      window.scrollTo(0, y);
    }
  }

  /* ---------- проверка ---------- */

  function check(silent) {
    if (S.state === "checking") return;
    S.state = "checking";
    S.err = "";
    if (!silent) renderNow();

    if (native()) {
      try {
        window.VSNative.checkUpdates();
        return;
      } catch (e) {
        fail("network", silent);
        return;
      }
    }
    webCheck(silent);
  }

  function webCheck(silent) {
    if (!window.fetch) { fail("network", silent); return; }
    var opts = { headers: { "Accept": "application/vnd.github+json" }, cache: "no-store" };
    window.fetch(API, opts).then(function (r) {
      if (r.status === 404) throw "no_releases";
      if (r.status === 403 || r.status === 429) throw "rate_limit";
      if (!r.ok) throw "http";
      return r.json();
    })["catch"](function (e) {
      // API исчерпал лимит — берём version.json, который лежит рядом с сайтом
      if (e !== "rate_limit" && e !== "http") throw e;
      return window.fetch(MANIFEST, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw e;
        return r.json().then(manifestAsApi);
      });
    }).then(function (j) {
      onCheckData({
        ok: true, tag: j.tag_name, name: j.name, notes: j.body,
        published: j.published_at, page: j.html_url,
        draft: j.draft, prerelease: j.prerelease,
        apk: pickAsset(j, ".apk"),
        html: pickAsset(j, ".html")
      });
    })["catch"](function (e) {
      fail(typeof e === "string" ? e : "network", silent);
    });
  }

  /** version.json → объект в форме ответа GitHub API, чтобы разбор остался одним. */
  function manifestAsApi(m) {
    var assets = [];
    if (m.apk) {
      assets.push({
        name: m.apk.name,
        browser_download_url: m.apk.url,
        size: m.apk.size || 0,
        digest: m.apk.sha256 ? "sha256:" + m.apk.sha256 : ""
      });
    }
    if (m.html) {
      assets.push({
        name: m.html.name,
        browser_download_url: m.html.url,
        size: m.html.size || 0,
        digest: m.html.sha256 ? "sha256:" + m.html.sha256 : ""
      });
    }
    return {
      tag_name: m.tag,
      name: m.version || m.semver || m.tag,
      body: m.notes || "",
      published_at: m.published || "",
      html_url: m.page || PAGE,
      assets: assets
    };
  }

  function pickAsset(j, ext) {
    var list = (j && j.assets) || [];
    for (var i = 0; i < list.length; i++) {
      var n = String(list[i].name || "").toLowerCase();
      if (n.slice(-ext.length) === ext) {
        return {
          url: list[i].browser_download_url,
          name: list[i].name,
          size: list[i].size || 0,
          digest: list[i].digest || ""
        };
      }
    }
    return null;
  }

  function onCheckData(j) {
    if (!j || !j.ok) { fail((j && j.status) || "network", false); return; }
    var prevState = S.state;
    var prevTag = S.rel ? S.rel.tag : "";
    S.rel = {
      tag: String(j.tag || ""),
      version: verOf(j.tag || j.name),
      name: String(j.name || j.tag || ""),
      notes: String(j.notes || ""),
      published: String(j.published || ""),
      page: String(j.page || PAGE),
      apk: j.apk || null,
      html: j.html || null
    };
    S.at = Date.now();
    S.err = "";
    S.silentErr = "";

    // новый тег — скачанный ранее файл устарел, иначе можно поставить старую версию
    if (S.rel.tag && S.rel.tag !== prevTag && native()) {
      try { window.VSNative.clearUpdateFile(); } catch (e) {}
      S.file = false;
    }

    if (newer()) {
      S.state = "available";
      if (S.file || fileReady()) S.state = "downloaded";
    } else {
      S.state = "latest";
      S.file = false;
      try { if (native()) window.VSNative.clearUpdateFile(); } catch (e) {}
    }
    saveRel();
    var route = String(location.hash || "");
    if (prevState !== S.state || prevTag !== S.rel.tag ||
        route.indexOf("/update") >= 0 || route.indexOf("/more") >= 0) {
      renderNow();
    }
  }

  function fail(code, silent) {
    S.err = code || "network";
    if (silent) {
      // тихая проверка ничего не перерисовывает: пользователь может быть в калькуляторе
      S.silentErr = S.err;
      if (S.state === "checking") S.state = S.rel && newer() ? "available" : "idle";
      return;
    }
    S.state = "error";
    S.at = Date.now();   // попытка была — не пишем «ещё ни разу»
    renderNow();
  }

  /* ---------- скачивание и установка ---------- */

  function startDownload() {
    if (!S.rel || !S.rel.apk) { openPage(); return; }
    if (!native()) { openUrl(S.rel.apk.url); return; }

    S.state = "downloading";
    S.pct = 0;
    S.got = 0;
    S.total = S.rel.apk.size || 0;
    renderNow();
    try {
      window.VSNative.downloadUpdate(S.rel.apk.url, S.rel.apk.name, S.rel.apk.digest || "");
    } catch (e) {
      fail("network", false);
    }
  }

  function install() {
    if (!native()) { openUrl(S.rel && S.rel.apk ? S.rel.apk.url : PAGE); return; }
    if (!canInstall()) { S.state = "needperm"; renderNow(); return; }
    try {
      window.VSNative.installUpdate();
    } catch (e) {
      fail("activity", false);
    }
  }

  function openPage() {
    var u = (S.rel && S.rel.page) || PAGE;
    openUrl(u);
  }

  function openUrl(u) {
    if (!u) return;
    if (native()) {
      try { window.VSNative.openUrl(u); return; } catch (e) {}
    }
    try { window.open(u, "_blank"); } catch (e) { location.href = u; }
  }

  function toggleAuto() {
    write(K_AUTO, autoOn() ? "0" : "1");
    renderNow();
  }

  function hideBanner() {
    if (S.rel) write(K_HIDE, S.rel.tag);
    renderNow();
  }

  /* ---------- разметка ---------- */

  function progressBar() {
    var pct = Math.max(0, Math.min(100, S.pct || 0));
    return '<div class="upd-bar"><i id="updBar" style="width:' + pct + '%"></i></div>' +
      '<div class="upd-pct" id="updPct">' + T("upd.downloading", { p: pct }) + '</div>';
  }

  function notesBlock() {
    if (!S.rel || !S.rel.notes) return "";
    var txt = esc(S.rel.notes)
      .replace(/\r\n/g, "\n")
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\n/g, "<br>");
    return '<details class="upd-notes"><summary>' + esc(T("upd.notes")) + '</summary>' +
      '<div class="upd-notes-body">' + txt + '</div></details>';
  }

  function statusLine(short) {
    var cur = curVersion();
    if (S.state === "checking") {
      return '<div class="upd-line"><span>' + esc(T("upd.checking")) + '</span><b class="upd-dots"><i></i><i></i><i></i></b></div>';
    }
    if (S.state === "latest") {
      return '<div class="upd-line"><span>' + esc(T("upd.latest", { v: cur })) + '</span><b class="ok">✓</b></div>';
    }
    if (S.state === "available" || S.state === "downloading" || S.state === "downloaded" ||
        S.state === "needperm" || S.state === "installing") {
      if (short) {
        return S.rel.published
          ? '<div class="upd-sub">' + esc(T("upd.published", { d: dateText(S.rel.published) })) + '</div>'
          : "";
      }
      var head = '<div class="upd-line"><span>' + esc(T("upd.available")) + '</span><b class="new">' + esc(S.rel.version) + '</b></div>';
      if (S.rel.published) {
        head += '<div class="upd-sub">' + esc(T("upd.published", { d: dateText(S.rel.published) })) + '</div>';
      }
      return head;
    }
    if (S.state === "error") {
      return '<div class="upd-line"><span>' + esc(errText(S.err)) + '</span><b class="bad">!</b></div>';
    }
    return '<div class="upd-line"><span>' + esc(T("upd.idle")) + '</span><b class="dim">–</b></div>';
  }

  function actions(full) {
    var h = "";
    var a = [];

    if (S.state === "checking") {
      a.push('<button class="btn block" disabled>' + esc(T("upd.checking")) + '</button>');
    } else if (S.state === "available") {
      if (native()) a.push('<button class="btn primary block" data-upd="download">' + esc(T("upd.download")) + '</button>');
      else {
        if (S.rel && S.rel.apk) a.push('<button class="btn primary block" data-upd="download">' + esc(T("upd.web.apk")) + '</button>');
        if (S.rel && S.rel.html) a.push('<button class="btn block" data-upd="html">' + esc(T("upd.web.html")) + '</button>');
        a.push('<button class="btn block" data-upd="page">' + esc(T("upd.openPage")) + '</button>');
      }
    } else if (S.state === "downloading") {
      a.push('<button class="btn block" disabled>' + esc(T("upd.downloading", { p: S.pct || 0 })) + '</button>');
    } else if (S.state === "downloaded") {
      if (native()) {
        if (canInstall()) a.push('<button class="btn primary block" data-upd="install">' + esc(T("upd.install")) + '</button>');
        else a.push('<button class="btn primary block" data-upd="allow">' + esc(T("upd.allowInstall")) + '</button>');
      } else {
        a.push('<button class="btn primary block" data-upd="download">' + esc(T("upd.web.apk")) + '</button>');
      }
      a.push('<button class="btn block" data-upd="download">' + esc(T("upd.reinstall")) + '</button>');
    } else if (S.state === "needperm") {
      a.push('<button class="btn primary block" data-upd="allow">' + esc(T("upd.allowInstall")) + '</button>');
    } else if (S.state === "installing") {

      "METHOD:PUBLISH",

    for (var i = 0; i < list.length; i++) {

      lines.push("DTSTART:" + icsStamp(r.at));
      lines.push("DTEND:" + icsStamp(r.at + 15 * 60000));
      lines.push("SUMMARY:" + icsEscape(r.title));
      lines.push("DESCRIPTION:" + icsEscape(r.body));

/* Роутер, экраны, калькулятор, время сервер/локал, RU/EN. Без зависимостей. */
(function () {

  var SERVER_OFFSET_MIN = -120;

  }

  var LANG = currentLang();

  /* ---------- время ---------- */

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function localOffsetMin() { return -new Date().getTimezoneOffset(); }
  function fmtHM(ms) {
    var d = new Date(ms);
    return pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes());
  }
  function nowServer() { return fmtHM(Date.now() + SERVER_OFFSET_MIN * 60000); }
  function nowLocal() { return fmtHM(Date.now() + localOffsetMin() * 60000); }

  // В расписании «Готовности к миссии» времена записаны по Москве — так их видит игрок.
  // Игровой день при этом меняется в 00:00 сервера, то есть в 05:00 МСК.
  var MSK_OFFSET_MIN = 180;
  // Порядок окон внутри игрового дня: от сброса (05:00) до 01:00.
  var SLOT_ORDER = [5, 0, 1, 2, 3, 4];

  function convHM(hm) {
    var parts = String(hm).split(":");
    var m = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    m += (TIME_MODE === "local" ? localOffsetMin() : SERVER_OFFSET_MIN) - MSK_OFFSET_MIN;
    m = ((m % 1440) + 1440) % 1440;
    return pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);

  }

    var d = new Date(ms + MSK_OFFSET_MIN * 60000);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() };
  }

  function mskEpoch(y, m, d, h, mi) {
    return Date.UTC(y, m, d, h, mi, 0) - MSK_OFFSET_MIN * 60000;
  }

  var DAY_PHASE = ["radar", "build", "tech", "hero", "ready", "raid", "sun"];

  function neededCats(dayIdx) {
    var list = TASK_CAT[DAY_PHASE[dayIdx]] || [];
    var out = [];
    list.forEach(function (c) { if (c && out.indexOf(c) < 0) out.push(c); });
    return out;
  }

  function buildReminders(opts) {
    var out = [];
    var now = Date.now();
    var id = 1;
    var base = mskParts(now);

    if (opts.windows) {
      // Одно напоминание на категорию в игровой день: в календаре бывает два окна одной
      // активности подряд (например, среда: «Исследования» в 05:00 и 09:00), и два
      // одинаковых уведомления подряд только мешают. Берём первое окно дня.
      var windowSeen = {};
      for (var i = 0; i < 8; i++) {
        var dt = new Date(Date.UTC(base.y, base.m, base.d + i));
        var wd = dt.getUTCDay();
        var dayIdx = wd === 0 ? 6 : wd - 1;
        var row = D().calendar.rows[dayIdx];
        var cats = neededCats(dayIdx);
        for (var k = 0; k < SLOT_ORDER.length; k++) {
          var si = SLOT_ORDER[k];
          var cat = row[si];
          if (cats.indexOf(cat) < 0) continue;
          var winKey = dt.getUTCFullYear() + "-" + dt.getUTCMonth() + "-" + dt.getUTCDate() + "|" + cat;
          if (windowSeen[winKey]) continue;
          windowSeen[winKey] = 1;
          var parts = D().calendar.slots[si].split(":");
          var h = parseInt(parts[0], 10), mi = parseInt(parts[1], 10);
          var at = mskEpoch(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate() + (h < 5 ? 1 : 0), h, mi);
          if (at < now + 60000) continue;
          var name = D().calendar.types[cat].title;
          out.push({
            id: id++,
            at: at,
            title: T("notif.window.title", { name: name }),
            body: T("notif.window.body", { name: name })
          });
        }
      }
    }

    if (opts.radarEve) {
      for (var r = 0; r < 9; r++) {
        var day = new Date(Date.UTC(base.y, base.m, base.d + r));
        var idx = day.getUTCDay();
        var gameDay = idx === 0 ? 6 : idx - 1;
        if (gameDay !== 0 && gameDay !== 2 && gameDay !== 4) continue;
        var dayStart = mskEpoch(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), 5, 0);
        var at = dayStart - 18 * 3600 * 1000;
        if (at < now + 60000) continue;
        out.push({ id: id++, at: at, title: T("notif.radar.title"), body: T("notif.radar.body") });
      }
    }

    if (opts.shields) {
      var today = new Date();
      for (var j = 0; j < 8; j++) {
        var t = new Date(today.getFullYear(), today.getMonth(), today.getDate() + j, 21, 0, 0, 0);
        if (t.getDay() === 5 && t.getTime() > now + 60000) {

      h += '<button disabled><span>←</span>' + T("phase.start") + '</button>';
    }
    if (i < data.phases.length - 1) {
      h += '<button data-go="#/phase/' + data.phases[i + 1].id + '" style="text-align:right"><span>' + esc(data.phases[i + 1].day) + ' →</span>' + esc(data.phases[i + 1].name) + '</button>';
    } else {
      h += '<button data-go="#/week" style="text-align:right"><span>→</span>' + T("phase.next") + '</button>';
    }
    h += '</div>';
    return h;
  }

  /* ---------- неделя ---------- */

  // Какая активность «Готовности к миссии» подходит заданию (по порядку пунктов плана).
  var TASK_CAT = {
    radar: [null, null, null, "fighter", null],
    build: [null, "build", "build", null, null, null],
    tech: [null, "research", "research", "research", "research", null],
    hero: [null, "hero", "hero", "hero", "hero"],
    ready: [null, "build", "train", "train", null],
    raid: [null, null, null, null, null, null, null, null],
    sun: [null, null, "build", null, null, null]
  };

  function taskWindowChip(dayId, idx) {
    var cats = TASK_CAT[dayId] || [];
    var cat = cats[idx];
    var row = null;
    if (cat) {
      var di = dayId === "sun" ? 6 : phaseIndex(dayId);
      row = D().calendar.rows[di];
    }
    var slot = null;
    if (row) {
      for (var k = 0; k < SLOT_ORDER.length; k++) {
        var si = SLOT_ORDER[k];
        if (row[si] === cat) { slot = D().calendar.slots[si]; break; }
      }
    }
    if (!cat || !slot) return '';
    return '<span class="task-when">' + esc(D().calendar.types[cat].short) + ' · ' + convHM(slot) + '</span>';
  }

  function renderTzBar() {
    var bar = $("#tzbar");
    if (!bar) return;
    bar.innerHTML =
      '<button class="tz-chip' + (TIME_MODE === "server" ? " active" : "") + '" data-tz="server">' +
        '<span>' + T("time.serverShort") + '</span><b>' + L("dayNames")[serverWeekdayIndex()] + ' ' + nowServer() + '</b></button>' +
      '<button class="tz-chip' + (TIME_MODE === "local" ? " active" : "") + '" data-tz="local">' +
        '<span>' + T("time.localShort") + '</span><b>' + L("dayNames")[localWeekdayIndex()] + ' ' + nowLocal() + '</b></button>';
  }
  function weekDays() {
    var out = [];
    D().phases.forEach(function (p) {
      out.push({ id: p.id, day: p.day, name: p.name, plan: p.plan, prep: p.prep, phase: p });
    });
    out.push({ id: "sun", day: D().sunday.day, name: D().sunday.name, plan: D().sunday.plan, prep: [], phase: null });
    return out;
  }

  function serverNowDate() { return new Date(Date.now() + SERVER_OFFSET_MIN * 60000); }

  function serverWeekdayIndex() {
    var d = serverNowDate().getUTCDay();
    return d === 0 ? 6 : d - 1;
  }

  function localWeekdayIndex() {
    var d = new Date().getDay();
    return d === 0 ? 6 : d - 1;
  }

  // Игровой день меняется в 00:00 серверного времени, а не в местную полночь.
  function todayIndex() { return serverWeekdayIndex(); }

  var weekSel = null;
  var calcPhase = "radar";
  var calcQty = {};
  var calcBonusAll = 100;
  var calcBonusCat = 50;

  function viewWeek() {
    var data = D();
    var days = weekDays();
    if (weekSel === null) weekSel = todayIndex();
    var d = days[weekSel];
    var next = days[(weekSel + 1) % 7];

    var h = '<h1>' + T("week.title") + '</h1>';
    h += '<p class="lead">' + T("week.lead") + '</p>';
    h += '<div class="dim" style="font-size:11.5px;margin:2px 2px 0">' + md(T("time.note")) + '</div>';

    h += '<div class="days">';
    days.forEach(function (day, idx) {
      h += '<button class="day-chip' + (idx === weekSel ? " active" : "") + '" data-day="' + idx + '">' +
        '<b>' + L("dayNames")[idx] + '</b><small>' + esc(day.name) + '</small></button>';
    });
    h += '</div>';

    h += '<div class="card" style="margin-top:12px">';
    h += '<div class="row"><div style="flex:1"><b style="font-size:16px">' + esc(d.day) + ' · ' + esc(d.name) + '</b>';
    if (d.phase) {
      h += '<div class="muted" style="font-size:12.5px">' + esc(d.phase.tag) + ' · +' + d.phase.dayPoint + ' ' + dayPoints(d.phase.dayPoint) + '</div>';
    } else {
      h += '<div class="muted" style="font-size:12.5px">' + T("week.noPoints") + '</div>';
    }
    h += '</div>' + (d.phase
      ? '<button class="btn" data-go="#/phase/' + d.id + '">' + T("week.guide") + '</button>'
      : '<span class="chip">' + T("week.pause") + '</span>') + '</div>';

    h += '<h3>' + T("week.tasks") + '</h3><div class="dim" style="font-size:11.5px;margin:-6px 0 6px">' + T("week.tasksNote") + '</div><ol class="steps">';
    d.plan.forEach(function (x, i) { h += '<li>' + md(x) + taskWindowChip(d.id, i) + '</li>'; });
    h += '</ol></div>';

    h += '<div class="card">';
    if (next.phase) {
      h += '<div class="tier-title"><b>' + T("week.prepNext", { day: isEn() ? esc(next.day) : L("dayNamesDat")[(weekSel + 1) % 7] }) + '</b></div>';
      h += '<div class="dim" style="font-size:11.5px;margin:-2px 0 6px">' + T("week.prepNextNote") + '</div>';
      h += '<ul class="clean">';
      next.prep.forEach(function (x) { h += '<li>' + md(x) + '</li>'; });
      h += '</ul>';
    } else {
      h += '<b>' + T("week.pauseNext") + '</b>';
    }
    h += '</div>';

    h += '<h2>' + T("week.cal.title") + '</h2>' +
      '<p class="muted" style="font-size:12.5px;margin-top:-4px">' + T("week.cal.text") + '</p>';

    h += '<div class="card tight" style="margin-top:10px">';
    SLOT_ORDER.forEach(function (si) {
      var typ = data.calendar.types[data.calendar.rows[weekSel][si]];
      h += '<div class="slot-row"><span class="time">' + convHM(data.calendar.slots[si]) + '</span><span class="name">' + esc(typ.title) + '</span></div>';
    });
    h += '</div>';

    h += '<div class="footer-note">' + T("week.cal.footer") + '</div>';
    return h;
  }

  /* ---------- калькулятор ---------- */

  function calcTotal() {
    var p = phaseById(calcPhase) || D().phases[0];
    var mult = 1 + (calcBonusAll + calcBonusCat) / 100;
    var sum = 0;
    p.scoring.forEach(function (s, i) {
      var q = parseFloat(calcQty[calcPhase + "." + i] || 0) || 0;
      sum += q * s.base * mult;
    });
    return sum;
  }

  function chestInfo(total) {
    var list = D().rewards.chests;
    var unlocked = 0;
    for (var i = 0; i < list.length; i++) if (total >= list[i].at) unlocked = i + 1;
    var next = unlocked < list.length ? list[unlocked] : null;
    var prev = unlocked > 0 ? list[unlocked - 1].at : 0;
    var pct = next ? Math.min(100, Math.round((total - prev) * 100 / (next.at - prev))) : 100;
    return { unlocked: unlocked, next: next, pct: pct };
  }

  function viewCalc() {
    var data = D();
    var p = phaseById(calcPhase) || data.phases[0];
    var total = calcTotal();

    var h = '<h1>' + T("calc.title") + '</h1>';
    h += '<p class="lead">' + T("calc.lead") + '</p>';

    h += '<div class="seg">';
    data.phases.forEach(function (ph) {
      h += '<button data-calc-phase="' + ph.id + '" class="' + (ph.id === calcPhase ? "active" : "") + '">' +
        L("dayNames")[ph.num - 1] + ' · ' + esc(ph.name) + '</button>';
    });
    h += '</div>';

    h += '<div class="card tight"><div class="bonus-grid">' +
      '<label>' + T("calc.bonusAll") + '<input type="number" id="bAll" min="0" max="200" step="10" value="' + calcBonusAll + '"></label>' +
      '<label>' + T("calc.bonusCat") + '<input type="number" id="bCat" min="0" max="100" step="10" value="' + calcBonusCat + '"></label>' +
      '</div><div class="dim" style="font-size:11px;margin-top:6px">' + T("calc.bonusNote") + '</div></div>';

    h += '<div class="card">';
    p.scoring.forEach(function (s, i) {
      var val = calcQty[calcPhase + "." + i] || "";
      h += '<div class="calc-row"><div class="lbl">' + esc(s.label) +
        '<small>' + fmt(s.base) + ' ' + T("calc.per", { unit: esc(s.unit) }) + '</small></div>' +
        '<input type="number" min="0" step="1" inputmode="numeric" data-calc-input="' + i + '" placeholder="0" value="' + val + '">' +
        '<div class="per" id="row' + i + '"></div></div>';
    });
    h += '</div>';

    h += '<div class="total-card" id="totalCard">' +
      '<div class="head"><div class="sum" id="totalSum">' + fmt(total) + '</div>' +
      '<div class="sub" id="totalChests"></div></div>' +
      '<div class="next" id="totalNext"></div>' +
      '<div class="bar"><i id="totalBar"></i></div>' +
      '</div>';
    h += '<div class="calc-spacer"></div>';

    h += '<div class="row" style="margin-top:12px"><button class="btn" id="calcReset">' + T("calc.reset") + '</button>' +
      '<button class="btn primary" data-go="#/rewards">' + T("calc.chestsBtn") + '</button></div>';
    h += '<div class="footer-note">' + T("calc.footer") + '</div>';
    return h;
  }

  function refreshCalc() {
    var p = phaseById(calcPhase) || D().phases[0];
    var mult = 1 + (calcBonusAll + calcBonusCat) / 100;
    p.scoring.forEach(function (s, i) {
      var q = parseFloat(calcQty[calcPhase + "." + i] || 0) || 0;
      var cell = $("#row" + i);
      if (cell) cell.textContent = q > 0 ? "+" + fmt(q * s.base * mult) : "";
    });
    var total = calcTotal();
    var ci = chestInfo(total);
    var sum = $("#totalSum");
    if (sum) sum.textContent = fmt(total);
    var bar = $("#totalBar");
    if (bar) bar.style.width = ci.pct + "%";
    var nx = $("#totalNext");
    if (nx) {
      if (!ci.next) nx.textContent = T("calc.allChests");
      else if (ci.unlocked === 0) nx.textContent = T("calc.toFirst", { a: fmt(ci.next.at - total), b: fmt(ci.next.at) });
      else nx.textContent = T("calc.toNext", { a: fmt(ci.next.at - total), b: fmt(ci.next.at) });
    }
    var cs = $("#totalChests");
    if (cs) cs.textContent = T("calc.total", { n: ci.unlocked });
  }

  /* ---------- награды ---------- */

  function viewRewards() {
    var data = D();
    var h = '<h1>' + T("rew.title") + '</h1>';
    h += '<p class="lead">' + T("rew.lead") + '</p>';

    ["base", "mid", "high"].forEach(function (t) {
      var meta = data.rewards.tiers[t];
      h += '<div class="tier-title"><b>' + esc(meta.title) + '</b><span>' + esc(meta.note) + '</span></div>';
      h += '<div class="card tight">';
      data.rewards.chests.forEach(function (c) {
        if (c.tier !== t) return;
        h += '<div class="reward"><div class="at">' + fmt(c.at) +
          '<small>' + (isEn() ? "points" : "очков") + '</small></div><div class="txt">' + esc(c.label) + '</div></div>';
      });
      h += '</div>';
    });

    h += '<h2>' + T("rew.weekly") + '</h2><div class="card">';
    data.rewards.weekly.forEach(function (w) {
      h += '<div class="reward"><div class="at" style="flex-basis:112px;color:var(--muted);font-size:11.5px">' + esc(w.cond) + '</div>' +
        '<div class="txt">' + esc(w.label) + '</div></div>';
    });
    h += '</div>';
    h += '<div class="note warn">' + T("rew.note") + '</div>';
    return h;
  }

  /* ---------- ещё ---------- */

  function viewMore() {
    var data = D();
    var h = '<h1>' + T("more.title") + '</h1>';
    if (window.VSPwa && window.VSPwa.card) h += window.VSPwa.card();
    if (window.VSUpd && window.VSUpd.card) h += window.VSUpd.card();

    h += '<h2>' + T("more.tech.title") + '</h2>';
    h += '<p class="muted" style="margin-top:-4px;font-size:13px">' + T("more.tech.lead") + '</p>';
    h += '<div class="table-wrap"><table><thead><tr><th>' + T("more.tech.col1") + '</th><th>' + T("more.tech.col2") + '</th></tr></thead><tbody>';
    data.tech.forEach(function (t) {
      h += '<tr><td>' + esc(t.name) + '<div class="dim" style="font-size:10.5px">' + esc(t.group) + '</div></td>' +
        '<td style="font-size:12.5px">' + esc(t.effect) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="note">' + T("more.tech.note") + '</div>';

    h += '<h2>' + T("more.radar.title") + '</h2>';
    h += '<div class="card"><ul class="clean">';
    for (var i = 1; i <= 5; i++) h += '<li>' + T("more.radar." + i) + '</li>';
    h += '</ul></div>';

    h += '<h2>' + T("more.raid.title") + '</h2>';
    h += '<div class="card"><ul class="clean">';
    for (var j = 1; j <= 5; j++) h += '<li>' + md(T("more.raid." + j)) + '</li>';
    h += '</ul></div>';

    h += '<h2>' + T("more.etiq.title") + '</h2>';
    h += '<div class="card"><ul class="clean">';
    for (var k = 1; k <= 3; k++) h += '<li>' + T("more.etiq." + k) + '</li>';
    h += '</ul></div>';

    h += '<h2>' + T("more.gloss.title") + '</h2><div class="card tight">';
    L("glossary").forEach(function (t) {
      h += '<div style="padding:8px 0;border-bottom:1px solid var(--line-soft)"><b>' + esc(t[0]) + '</b>' +
        '<div class="muted" style="font-size:12.5px">' + esc(t[1]) + '</div></div>';
    });
    h += '</div>';

    h += '<h2>' + T("more.faq.title") + '</h2>';
    data.faq.forEach(function (f, i) {
      h += '<details class="acc"' + (i === 0 ? " open" : "") + '><summary>' + esc(f.q) + '</summary>' +
        '<div class="body">' + md(f.a) + '</div></details>';
    });

    h += '<h2>' + T("more.src.title") + '</h2><div class="card tight">';
    data.sources.forEach(function (s) {
      h += '<div style="padding:7px 0;font-size:13px"><a href="' + esc(s.u) + '">' + esc(s.t) + '</a></div>';
    });
    h += '</div>';

    h += '<div class="footer-note">' + T("more.ver", { v: data.version, d: data.updated }) + '<br>' +
      esc(T("more.author")) + '<br>' +
      T("more.disclaimer") + '<br>' + T("more.disclaimer2") + '</div>';
    return h;
  }

  /* ---------- роутер ---------- */

  function parseRoute() {
    var raw = (location.hash || "#/").replace(/^#/, "");
    if (!raw) raw = "/";
    var parts = raw.split("/").filter(Boolean);
    return { name: parts[0] || "home", arg: parts[1] || null };
  }

  function render() {
    var r = parseRoute();
    var screen = $("#screen");
    var html = "";
    var tab = "home";

    if (r.name === "phase") { html = viewPhase(r.arg); tab = "home"; }
    else if (r.name === "week") { html = viewWeek(); tab = "week"; }
    else if (r.name === "calc") { html = viewCalc(); tab = "calc"; }
    else if (r.name === "rewards") { html = viewRewards(); tab = "rewards"; }
    else if (r.name === "more") { html = viewMore(); tab = "more"; }
    else if (r.name === "update") { html = window.VSUpd ? window.VSUpd.screen() : ""; tab = "more"; }
    else if (r.name === "install") { html = (window.VSPwa && window.VSPwa.screen) ? window.VSPwa.screen() : viewMore(); tab = "more"; }
    else { html = viewHome(); tab = "home"; }

    screen.innerHTML = html;
    $$(".nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    var moreBtn = $('.nav button[data-tab="more"]');
    if (moreBtn) moreBtn.classList.toggle("has-dot", !!(window.VSUpd && window.VSUpd.hasUpdate && window.VSUpd.hasUpdate()));
    renderTzBar();
    if (r.name === "calc") refreshCalc();
    window.scrollTo(0, 0);
  }

  /* ---------- события ---------- */

  document.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]");
    if (go) {
      var target = go.getAttribute("data-go");
      if (location.hash === target) render(); else location.hash = target;
      return;
    }

    var pwaBtn = e.target.closest("[data-pwa]");
    if (pwaBtn) {
      if (window.VSPwa) window.VSPwa.action(pwaBtn.getAttribute("data-pwa"));
      return;
    }

    var updBtn = e.target.closest("[data-upd]");
    if (updBtn) {
      if (window.VSUpd) window.VSUpd.action(updBtn.getAttribute("data-upd"));
      return;
    }

    var tzBtn = e.target.closest("[data-tz]");
    if (tzBtn) {
      setTimeMode(tzBtn.getAttribute("data-tz"));
      return;
    }

    var dayBtn = e.target.closest("[data-day]");
    if (dayBtn) {
      weekSel = parseInt(dayBtn.getAttribute("data-day"), 10);
      render();
      return;
    }

    var phBtn = e.target.closest("[data-calc-phase]");
    if (phBtn) {
      calcPhase = phBtn.getAttribute("data-calc-phase");
      render();
      return;
    }

    var remBtn = e.target.closest("[data-rem]");
    if (remBtn) { toggleReminder(remBtn.getAttribute("data-rem")); return; }

    if (e.target.closest("[data-rem-test]")) {
      if (nativeOK()) {
        try { window.VSNative.testNotification(T("notif.test.title"), T("notif.test.body")); } catch (err) {}
      }
      return;
    }

    if (e.target.closest("[data-rem-exact]")) {
      if (nativeOK()) { try { window.VSNative.requestExactAlarmPermission(); } catch (err) {} }
      return;
    }

    if (e.target.closest("[data-rem-nsettings]")) {
      if (nativeOK()) { try { window.VSNative.openNotificationSettings(); } catch (err) {} }
      return;
    }

    if (e.target.closest("[data-rem-battery]")) {
      if (nativeOK()) { try { window.VSNative.openBatterySettings(); } catch (err) {} }
      return;
    }

    if (e.target.closest("[data-rem-perm]")) {
      if (nativeOK()) window.VSNative.requestNotificationPermission();
      setTimeout(render, 1200);
      return;
    }

    if (e.target.closest("#exitBtn")) { openExitSheet(); return; }

    if (e.target.closest("[data-sheet-cancel]") || e.target.id === "sheet") { closeSheet(); return; }

    if (e.target.closest("[data-sheet-ok]")) {
      closeSheet();
      if (nativeOK()) window.VSNative.exitApp();
      return;
    }

    if (e.target.id === "calcReset") { calcQty = {}; render(); return; }

    if (e.target.id === "themeBtn") {
      applyTheme(currentTheme() === "light" ? "dark" : "light");
      return;
    }
    if (e.target.id === "langBtn") {
      setLang(LANG === "ru" ? "en" : "ru");
      return;
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute("data-calc-input")) {
      var idx = parseInt(t.getAttribute("data-calc-input"), 10);
      calcQty[calcPhase + "." + idx] = t.value;
      refreshCalc();
      return;
    }
    if (t.id === "bAll" || t.id === "bCat") {
      var v = Math.max(0, Math.min(300, parseInt(t.value || "0", 10) || 0));
      if (t.id === "bAll") calcBonusAll = v; else calcBonusCat = v;
      refreshCalc();
    }
  });

  window.addEventListener("hashchange", render);
  window.addEventListener("vs-permission", function () {
    if (parseRoute().name === "home") render();
  });

  window.__androidBack = function () {
    var sheet = $("#sheet");
    if (sheet && !sheet.hidden) { closeSheet(); return true; }

    var open = $$("details.acc[open]");
    if (open.length) {
      open.forEach(function (d) { d.removeAttribute("open"); });
      return true;
    }
    var r = parseRoute();
    if (r.name !== "home") {
      history.back();
      return true;
    }
    return false;
  };

  window.VSUI = { esc: esc, md: md, fmt: fmt, lang: LANG };
  window.__vsRender = render;
  window.__vsReminders = buildReminders;   // нужно PWA для .ics-календаря

  applyLangUI();
  applyTheme(currentTheme());
  syncReminders();
  if (window.VSPwa && window.VSPwa.init) window.VSPwa.init();
  if (window.VSUpd && window.VSUpd.init) window.VSUpd.init();
  render();
})();

</script>
<script>
  window.VS_PUSH = { endpoint: "", vapid: "" };
  (function () {
    var secure = location.protocol === 'https:' ||
      location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!('serviceWorker' in navigator) || !secure) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js')["catch"](function () {});
    });
  })();
</script>
</body>
</html>
